name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Stdlib + pytest only: the suite never imports PyQt6 or touches hardware.
      - run: python3 -m pip install pytest
      - run: python3 -m pytest
      - run: python3 -m unittest discover -s decky/tests
