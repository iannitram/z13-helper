[pytest]
# Only tests/: tooling/spike1_qam_test.py matches pytest's default *_test.py
# pattern but is a manual on-device spike, not a test.
testpaths = tests
# langsmith's pytest plugin (pip --user on the Deck) crashes at startup because
# `packaging` isn't installed there; the suite doesn't use it. Harmless elsewhere.
addopts = -ra -p no:langsmith_plugin
